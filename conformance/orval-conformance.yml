description: >-
  Orval consumes and emits specifications rather than serving an API, so its
  conformance surface is the set of specification formats it reads on the input
  side and the standards it targets on the output side. Every entry below is
  evidenced from the provider's own docs, llms.txt, or monorepo package set —
  nothing is asserted about a runtime API, because Orval has none.
