aid: orval
name: Orval
description: >-
  Orval is an MIT-licensed open source code generator that turns any valid
  OpenAPI v3 or Swagger v2 specification into type-safe TypeScript. From one
  spec it emits HTTP request functions (Fetch by default, Axios optional),
  TanStack Query hooks for React, Vue, Svelte, Solid and Angular, SWR hooks,
  Angular HttpClient services, SolidStart primitives, Hono server templates,
  Zod and Effect validation schemas, MSW handlers with Faker mock data, and
  Model Context Protocol servers for agent integration. It ships as a CLI plus
  a programmatic API, is configured through an orval.config.ts file with
  per-project targets, transformers, hooks and output modes, and is distributed
  on npm as `orval` alongside thirteen first-party `@orval/*` generator
  packages and an official ghcr.io container image. Orval itself exposes no
  hosted HTTP API — the specification is the input, and generated client code
  is the product.
