x-surface:
  note: >-
    Orval is a build-time OpenAPI code generator, not an API provider. It hosts
    no HTTP API, so openapi/, asyncapi/, graphql/, authentication/, scopes/,
    errors/, data-model/, conventions/, mcp/ and a2a/ are correctly absent —
    there is nothing to harvest, and nothing was invented to fill them. The
    /.well-known/ probes all returned 404 and the A2A agent-card probe missed,
    so no agent card was written. @orval/mcp GENERATES MCP servers for other
    APIs; Orval does not operate one, so no MCPServer pointer is claimed.
  checked: '2026-08-06'
